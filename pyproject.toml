[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "faultline"
version = "0.1.0"
description = "Structural ML failure detection on the DataHub metadata graph. Your model didn't drift — your graph did."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Faultline contributors" }]
keywords = ["datahub", "metadata", "lineage", "mlops", "data-quality", "agents", "mcp"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
  "acryl-datahub>=1.0.0",
  "httpx>=0.27",
  "pydantic>=2.7",
  "typer>=0.12",
  "rich>=13.7",
  "PyYAML>=6.0",
  "sqlglot>=25.0",
  "Jinja2>=3.1",
]

[project.optional-dependencies]
agent = [
  "anthropic>=0.40",
  "mcp>=1.0",
]
demo = [
  "duckdb>=1.0",
  "dbt-core>=1.8",
  "dbt-duckdb>=1.8",
]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-PyYAML",
]

[project.scripts]
faultline = "faultline.cli:app"

[project.urls]
Homepage = "https://github.com/madhavvan/faultline"
Repository = "https://github.com/madhavvan/faultline"

[tool.hatch.build.targets.wheel]
packages = ["src/faultline"]

# The demo fixtures are captured from a real dbt run and shipped in the wheel, so
# `faultline demo` works from a plain `pip install` with no warehouse to build.
[tool.hatch.build.targets.wheel.force-include]
"src/faultline/data" = "faultline/data"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W", "C4", "SIM"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
markers = [
  "live: requires a running DataHub instance (deselect with '-m \"not live\"')",
]

[tool.mypy]
python_version = "3.10"
packages = ["faultline"]
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = false
